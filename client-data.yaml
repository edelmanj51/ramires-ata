# ── About section ─────────────────────────────────────────────────────────────
ABOUT_TEXT: "Ramires ATA Black Belt Academy was founded in December 2007 by Frederica M. Ramires — known to students as Dolly — a 5th Degree Black Belt with 40+ years of martial arts experience and a 22-year career in law enforcement, rising from Corporal to Chief. Training in a 1,750-square-foot facility in Swansboro, NC, Ramires ATA follows the American Taekwondo Association curriculum, developing strength, focus, discipline, and real self-defense skills in students from age 3 through adult."

