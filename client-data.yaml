INSTRUCTOR_1_BIO: "Frederica M. Ramires — \"Dolly\" to her students — founded Ramires ATA Black Belt Academy in December 2007, building it into the Crystal Coast's premier ATA school. A 5th Degree Black Belt certified by ATA International headquarters in Little Rock, AR, Dolly brings 40+ years of martial arts experience alongside a 22-year law enforcement career that took her from Corporal all the way to Chief. She holds a Level 3 Krav Maga certification and is a specialist in ATA Xtreme Forms, Xtreme Weapons, Creative Forms, Sparring, and Traditional disciplines — plus defensive tactics and sexual harassment and rape prevention instruction. That law enforcement background gives Dolly's Women's Self-Defense program a credibility and real-world depth that most instructors simply can't match."

